[project]
name = "internal-plugings"
version = "0.1.0"
description = "Internal plugins"
requires-python = ">=3.11"
dependencies = [
    "singer-sdk~=0.54.5",
]

[project.scripts]
tap-francetravail = "tap_francetravail.tap:TapFranceTravail.cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "extractors/tap_francetravail",
]